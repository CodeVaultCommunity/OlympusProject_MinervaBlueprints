name: Verify Minerva Blueprints
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e "versioning/Alpha-v0.1.0"
      - run: python scripts/check_repository.py
      - run: python -m pytest scripts/tests
      - run: python -m pytest versioning/Alpha-v0.1.0/tests
      - run: python versioning/Alpha-v0.1.0/run_examples.py --all
      - run: python versioning/Alpha-v0.1.0/examples/counterexamples/check.py
      - run: python scripts/content_inventory.py --check
