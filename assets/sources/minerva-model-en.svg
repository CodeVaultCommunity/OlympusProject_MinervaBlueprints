<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="asset-title asset-description">
<title id="asset-title">Minerva Blueprints · model content</title>
<desc id="asset-description">ADPM and ADVS form the L2 model. A blueprint identifies contracts and scenarios. The YAML profile mirrors files in L2, records state and origin, and describes classes, functions, structs and modules.</desc>
<defs>
