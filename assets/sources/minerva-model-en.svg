="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="255.0" y="309" width="220" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="365" y="336" font-size="20" fill="#15314f" font-weight="400" text-anchor="middle" >Model</text><rect x="925.0" y="309" width="220" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="1035" y="336" font-size="20" fill="#15314f" font-weight="400" text-anchor="middle" >Plan</text><rect x="170" y="390" width="1060" height="185" rx="18" fill="#0b1d36" stroke="#009db8" stroke-width="2.5"/><g transform="translate(210 417) scale(0.95)" fill="none" stroke="#80e8ef" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="11" height="11" rx="2"/><rect x="26" y="3" width="11" height="11" rx="2"/><rect x="15" y="27" width="11" height="11" rx="2"/><path d="M8.5 14v7H31.5v-7 M20.5 21v6"/></g><text x="267" y="447" font-size="29" fill="#80e8ef" font-weight="700" text-anchor="start" >One project blueprint</text><text x="210" y="497" font-size="23" fill="#e4f2ff" font-weight="400" text-anchor="start" >Stable logical IDs, versions, source contracts and semantic links.</text><text x="210" y="534" font-size="23" fill="#e4f2ff" font-weight="400" text-anchor="start" >ADPM and ADVS stay connected and independently identifiable.</text><path d="M700 576V682" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="580.0" y="609" width="240" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="700" y="636" font-size="20" fill="#15314f" font-weight="400" text-anchor="middle" >YAML profile</text><rect x="60" y="695" width="1280" height="350" rx="18" fill="#eef8ff" stroke="#80bddb" stroke-width="2.5"/><g transform="translate(95 720) scale(0.95)" fill="none" stroke="#1576cb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H25l8 8v26H9Z M25 3v9h8 M15 19h12 M15 25h12 M15 31h8"/></g><text x="152" y="750" font-size="28" fill="#1576cb" font-weight="700" text-anchor="start" >Per-file mirror · L2</text><text x="95" y="802" font-size="23" fill="#15314f" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono,monospace">apps/&lt;App&gt;/&lt;path&gt;/&lt;File.ext&gt;</text><text x="95" y="843" font-size="23" fill="#007786" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono,monospace">docs/L2_MinervaBlueprints/apps/&lt;App&gt;/&lt;path&gt;/&lt;File.ext&gt;.yaml</text><text x="100" y="901" font-size="22" fill="#1576cb" font-weight="700" text-anchor="start" >Source state</text><text x="100" y="936" font-size="21" fill="#15314f" font-weight="400" text-anchor="start" >planned  ·  observed</text><text x="100" y="974" font-size="22" fill="#1576cb" font-weight="700" text-anchor="start" >Document nature</text><text x="100" y="1009" font-size="21" fill="#15314f" font-weight="400" text-anchor="start" >designed  ·  reconstructed  ·  mixed</text><text x="760" y="901" font-size="22" fill="#007786" font-weight="700" text-anchor="start" >Identified units</text><text x="760" y="936" font-size="21" fill="#15314f" font-weight="400" text-anchor="start" >Classes, functions, structs and modules.</text><text x="760" y="971" font-size="21" fill="#15314f" font-weight="400" text-anchor="start" >Contracts, dependencies and behavior.</text><text x="760" y="1006" font-size="21" fill="#15314f" font-weight="400" text-anchor="start" >Links to ADPM, ADVS and source files.</text><rect x="60" y="1090" width="1280" height="60" rx="14" fill="#f8fcff" stroke="#c4dfed" stroke-width="2"/><text x="700" y="1128" font-size="21" fill="#415e78" font-weight="400" text-anchor="middle" >docs/ is recommended; Shared/ provides cross-cutting support, not a new OAL layer.</text></g></g>
