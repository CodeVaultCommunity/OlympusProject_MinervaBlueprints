<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="asset-title asset-description">
<title id="asset-title">Minerva Blueprints · conteúdo do modelo</title>
<desc id="asset-description">ADPM e ADVS formam o modelo L2. Um blueprint identifica contratos e cenários. O perfil YAML espelha arquivos em L2, identifica estado e origem e descreve classes, funções, structs e módulos.</desc>
