ght="400" text-anchor="start" >do modelo selecionado.</text><text x="330" y="980" font-size="22" fill="#15314f" font-weight="400" text-anchor="start" >A realização executa.</text><path d="M771 921H856" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="772.0" y="856" width="96" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="820" y="883" font-size="18" fill="#15314f" font-weight="400" text-anchor="middle" >Saída</text><rect x="870" y="800" width="430" height="230" rx="18" fill="#eef8ff" stroke="#80bddb" stroke-width="2.5"/><g transform="translate(900 825) scale(0.95)" fill="none" stroke="#1576cb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h24v34H8Z M14 12h12 M14 19h12 M14 27l4 4 8-9"/></g><text x="957" y="855" font-size="23" fill="#1576cb" font-weight="700" text-anchor="start" >Evidências · L3</text><text x="900" y="906" font-size="21" fill="#15314f" font-weight="400" text-anchor="start" >Resultados e limites observados.</text><text x="900" y="943" font-size="21" fill="#15314f" font-weight="400" text-anchor="start" >Vínculos com cenários ADVS.</text><text x="900" y="980" font-size="21" fill="#15314f" font-weight="400" text-anchor="start" >Diferenças alimentam revisão.</text><path d="M1085 1031V1100H150V363H286" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="10 8"/><rect x="30.0" y="570" width="240" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="150" y="597" font-size="20" fill="#15314f" font-weight="400" text-anchor="middle" >Revisar diferenças</text><rect x="60" y="1140" width="1280" height="55" rx="14" fill="#f8fcff" stroke="#c4dfed" stroke-width="2"/><text x="700" y="1175" font-size="21" fill="#415e78" font-weight="400" text-anchor="middle" >Fluxo de trabalho com revisão explícita; as setas não prometem