<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="asset-title asset-description">
<title id="asset-title">Minerva Blueprints · fluxo de trabalho</title>
<desc id="asset-description">Fluxo de trabalho proposto: entradas versionadas, modelagem ou realização, revisão explícita, execução e evidências. O retorno tracejado indica revisão das diferenças ou impactos, nunca atualização automática dos contratos.</desc>
